<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>یه سورپرایز برای تو ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:Tahoma,Arial,sans-serif;
  background:radial-gradient(circle at 50% 35%,#fff7fb 0,#ffdce9 35%,#e99ab8 100%);
  display:flex;align-items:center;justify-content:center;color:#6b1837;
}
.wrap{text-align:center;width:100%;padding:24px}
.hint{font-size:18px;margin-bottom:28px;opacity:.85;animation:pulse 1.8s infinite}
.gift{position:relative;width:220px;height:190px;margin:auto;cursor:pointer;filter:drop-shadow(0 18px 18px rgba(94,20,49,.22))}
.box{position:absolute;left:15px;right:15px;bottom:0;height:125px;background:linear-gradient(135deg,#d82d68,#a9164b);border-radius:8px 8px 18px 18px}
.box:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:34px;transform:translateX(-50%);background:#f7c85b}
.lid{position:absolute;left:7px;right:7px;top:42px;height:42px;background:linear-gradient(135deg,#e43b75,#b51b52);border-radius:9px;z-index:3;transform-origin:10% 100%;transition:1s cubic-bezier(.2,.8,.2,1)}
.lid:before{content:"";position:absolute;left:50%;top:0;height:42px;width:34px;transform:translateX(-50%);background:#f7c85b}
.bow{position:absolute;z-index:4;top:8px;left:50%;transform:translateX(-50%);width:90px;height:55px}
.bow:before,.bow:after{content:"";position:absolute;top:5px;width:42px;height:32px;background:#f7c85b;border-radius:50% 50% 45% 10%;border:3px solid #e5ae3d}
.bow:before{left:0;transform:rotate(20deg)} .bow:after{right:0;transform:scaleX(-1) rotate(20deg)}
.knot{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:25px;height:25px;border-radius:50%;background:#ffd86c;z-index:5}
.gift.open .lid{transform:translateY(-70px) rotate(-10deg)}
.gift.open .bow{transform:translate(-50%,-55px) rotate(-8deg);transition:1s}
.gift.open{animation:shake .6s ease}
.message{position:absolute;left:50%;top:50%;transform:translate(-50%,80px) scale(.2);width:min(90vw,520px);opacity:0;transition:1s cubic-bezier(.2,.9,.2,1);pointer-events:none}
.message.show{transform:translate(-50%,0) scale(1);opacity:1}
.card{background:rgba(255,255,255,.92);border:2px solid rgba(216,45,104,.18);border-radius:24px;padding:28px 22px;box-shadow:0 18px 55px rgba(100,20,50,.2)}
.card .heart{font-size:38px}
.card h1{font-size:30px;margin:12px 0 8px}
.card p{font-size:20px;margin:0;line-height:1.9}
.spark{position:absolute;font-size:24px;opacity:0}
.show .spark{animation:float 2.4s infinite}
.s1{left:8%;top:20%}.s2{right:10%;top:30%;animation-delay:.4s!important}.s3{left:18%;bottom:18%;animation-delay:.8s!important}.s4{right:20%;bottom:20%;animation-delay:1.2s!important}
@keyframes pulse{50%{transform:scale(1.04);opacity:1}}
@keyframes shake{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes float{0%{opacity:0;transform:translateY(10px) scale(.7)}30%{opacity:1}100%{opacity:0;transform:translateY(-90px) scale(1.2)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hint">یه سورپرایز کوچولو برات دارم ❤️<br><small>روی جعبه کادو بزن</small></div>
  <div class="gift" id="gift" aria-label="باز کردن کادو">
    <div class="bow"><div class="knot"></div></div>
    <div class="lid"></div>
    <div class="box"></div>
  </div>
</div>

<div class="message" id="message">
  <div class="card">
    <div class="heart">❤️</div>
    <h1>که‌وه جان، امشب شام مهمون منی ❤️</h1>
    <p>امشب رو فقط برای خودمون کنار بذار...<br>منتظرم ببینمت عشقم 🥰</p>
  </div>
</div>
<div class="spark s1">✨</div><div class="spark s2">💖</div>
<div class="spark s3">✨</div><div class="spark s4">💕</div>

<script>
const gift=document.getElementById('gift');
const message=document.getElementById('message');
gift.addEventListener('click',()=>{
  if(gift.classList.contains('open')) return;
  gift.classList.add('open');
  setTimeout(()=>message.classList.add('show'),650);
});
</script>
</body>
</html>
